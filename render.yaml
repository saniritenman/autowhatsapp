services:
  - type: web
    name: autowhatsapp-bridge
    runtime: docker
    dockerfilePath: ./bridge/Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    numInstances: 1
    disk:
      name: whatsapp-session
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SUPABASE_URL
        value: https://cdvnclwqpcgulrxwvbwa.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: AW_OWNER_ID
        sync: false
      - key: ENABLE_LIVE_SEND
        value: "false"
